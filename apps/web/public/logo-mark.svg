<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="blue" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6fe0"/>
      <stop offset="1" stop-color="#5eb0ff"/>
    </linearGradient>
  </defs>
  <!-- two radar arcs, centered on the lower right, forming the left side of the A -->
  <path d="M 26 186 A 128 128 0 0 1 84 70" fill="none" stroke="url(#blue)" stroke-width="13"/>
  <path d="M 66 186 A 88 88 0 0 1 100 108" fill="none" stroke="#ffffff" stroke-width="13"/>
  <!-- the peak and right leg -->
  <polygon points="100,10 194,186 152,186 100,86" fill="#ffffff"/>
  <!-- small foot, like the satellite and ground it looks at -->
  <polygon points="118,186 152,186 135,150" fill="url(#blue)"/>
</svg>
